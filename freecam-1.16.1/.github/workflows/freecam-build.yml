name: Build Freecam 1.16.1

on:
  push:
    paths:
      - 'freecam-1.16.1/**'
      - '.github/workflows/freecam-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Generate wrapper
        working-directory: freecam-1.16.1
        run: gradle wrapper --gradle-version 6.7.1
      - name: Clean build
        working-directory: freecam-1.16.1
        run: ./gradlew clean build sourceZip --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: freecam-1.0.0-jar
          path: freecam-1.16.1/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: freecam-1.0.0-source
          path: freecam-1.16.1/build/distributions/*source.zip
          if-no-files-found: error
