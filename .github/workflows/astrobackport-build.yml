name: Build AstroBackport 1.16.1

on:
  push:
    branches:
      - main
      - astrobackport-ci
    paths:
      - 'mods/AstroBackport-1.16.1/**'
      - '.github/workflows/astrobackport-build.yml'
  pull_request:
    paths:
      - 'mods/AstroBackport-1.16.1/**'
      - '.github/workflows/astrobackport-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Forge 1.16.1 mod
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Decode and extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/astrobackport"
          cat mods/AstroBackport-1.16.1/source.tar.gz.b64.part-* > "$RUNNER_TEMP/source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/source.tar.gz.b64" | tar -xz -C "$RUNNER_TEMP/astrobackport"

      - name: Build mod
        shell: bash
        working-directory: ${{ runner.temp }}/astrobackport
        run: gradle --no-daemon clean build

      - name: Verify output JAR
        shell: bash
        working-directory: ${{ runner.temp }}/astrobackport
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -print -quit | grep -q .
          echo "Build produced:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -printf '%f\n'

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstroBackport-1.16.1-${{ github.run_number }}
          path: ${{ runner.temp }}/astrobackport/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
