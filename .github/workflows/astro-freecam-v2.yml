name: Astro Freecam Replay v2

on:
  push:
    branches:
      - freecam-v2-final
    paths:
      - 'freecam-1.16.1/**'
      - '.github/workflows/astro-freecam-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'
      - name: Generate wrapper
        working-directory: freecam-1.16.1
        run: gradle wrapper --gradle-version 5.6.4
      - name: Compilation pass 1
        working-directory: freecam-1.16.1
        run: ./gradlew clean compileJava --no-daemon
      - name: Compilation pass 2
        working-directory: freecam-1.16.1
        run: ./gradlew compileJava --no-daemon
      - name: Final build pass
        working-directory: freecam-1.16.1
        run: ./gradlew clean build sourceZip --no-daemon
      - name: Verify artifact contents
        working-directory: freecam-1.16.1
        shell: bash
        run: |
          test -f build/libs/freecam-2.0.0.jar
          jar tf build/libs/freecam-2.0.0.jar | grep -q 'ReplayStudioScreen.class'
          jar tf build/libs/freecam-2.0.0.jar | grep -q 'ReplayHudRenderer.class'
          jar tf build/libs/freecam-2.0.0.jar | grep -q 'ReplayManager.class'
          jar tf build/libs/freecam-2.0.0.jar | grep -q 'FreecamClient.class'
      - uses: actions/upload-artifact@v4
        with:
          name: astro-freecam-replay-v2-jar
          path: freecam-1.16.1/build/libs/freecam-2.0.0.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: astro-freecam-replay-v2-source
          path: freecam-1.16.1/build/distributions/astro-freecam-2.0.0-source.zip
          if-no-files-found: error
