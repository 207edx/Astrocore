name: Build Freecam 1.16.1

on:
  pull_request:
    paths:
      - 'freecam-1.16.1/**'
      - '.github/workflows/freecam-build.yml'
  push:
    paths:
      - 'freecam-1.16.1/**'
      - '.github/workflows/freecam-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'
      - name: Generate wrapper
        working-directory: freecam-1.16.1
        run: gradle wrapper --gradle-version 5.6.4
      - name: Clean build
        working-directory: freecam-1.16.1
        run: ./gradlew clean build sourceZip --no-daemon
      - name: Client smoke test
        working-directory: freecam-1.16.1
        shell: bash
        run: |
          set +e
          timeout 30s xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client-smoke.log
          code=${PIPESTATUS[0]}
          if grep -q "freecam : FMLClientSetupEvent" client-smoke.log; then
            if [ "$code" -eq 124 ] || [ "$code" -eq 143 ] || [ "$code" -eq 137 ] || [ "$code" -eq 0 ]; then
              exit 0
            fi
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: freecam-1.0.0-jar
          path: freecam-1.16.1/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: freecam-1.0.0-source
          path: freecam-1.16.1/build/distributions/*source.zip
          if-no-files-found: error


  client-smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'
      - name: Generate wrapper
        working-directory: freecam-1.16.1
        shell: powershell
        run: gradle.bat wrapper --gradle-version 5.6.4
      - name: Windows clean build
        working-directory: freecam-1.16.1
        shell: powershell
        run: .gradlew.bat clean build --no-daemon
      - name: Windows runClient smoke test
        working-directory: freecam-1.16.1
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c .gradlew.bat runClient --no-daemon > client-smoke.log 2>&1" -PassThru -NoNewWindow
          $finished = $proc.WaitForExit(90000)
          if (-not $finished) {
            taskkill /F /T /PID $proc.Id | Out-Null
            $code = 124
          } else {
            $code = $proc.ExitCode
          }
          Get-Content client-smoke.log
          $text = Get-Content client-smoke.log -Raw
          if ($text -match "freecam : FMLClientSetupEvent") {
            if ($code -eq 124 -or $code -eq 0) {
              exit 0
            }
          }
          exit $code
